name: Assignment 2 Feedback & Screenshot Report

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      # ── Stage 1: Checkout & Project Layout Detection ──────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Detect Backend & Frontend Directories
        id: dirs
        run: |
          if [ -f "backend/package.json" ]; then
            BACKEND_DIR="backend"
          elif [ -f "package.json" ]; then
            BACKEND_DIR="."
          else
            echo "::error::Could not find backend package.json in root or backend/"
            exit 1
          fi

          if [ -f "frontend/package.json" ]; then
            FRONTEND_DIR="frontend"
            HAS_FRONTEND="true"
          else
            FRONTEND_DIR="frontend"
            HAS_FRONTEND="false"
            echo "::warning::frontend/package.json not found! Assignment 2 requires the Vue 3 SPA inside frontend/."
          fi

          echo "backend_dir=$BACKEND_DIR" >> "$GITHUB_OUTPUT"
          echo "frontend_dir=$FRONTEND_DIR" >> "$GITHUB_OUTPUT"
          echo "has_frontend=$HAS_FRONTEND" >> "$GITHUB_OUTPUT"
          mkdir -p /home/runner/report-artifact/screenshots

      - name: Install Backend Dependencies
        working-directory: ${{ steps.dirs.outputs.backend_dir }}
        run: npm ci || npm install

      - name: Install Frontend Dependencies
        if: steps.dirs.outputs.has_frontend == 'true'
        working-directory: ${{ steps.dirs.outputs.frontend_dir }}
        run: npm ci || npm install

