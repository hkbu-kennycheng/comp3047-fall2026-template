              },
              {
                _id: new ObjectId('507f1f77bcf86cd799439026'),
                title: 'Autonomous Robotics Symposium',
                description: 'Embedded control, swerve kinematics, and vision systems.',
                bannerImage: 'https://picsum.photos/seed/event6/800/400',
                category: 'Conference',
